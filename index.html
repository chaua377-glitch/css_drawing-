<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        #sky{
           width: 1000px;
           aspect-ratio: 1;
           background-color: aqua;
           position: relative;
        }
        #building{
            width: 800px;
            aspect-ratio: 1;
            background-color: gray;
            position: absolute;
            margin-top: 200px;
            left: 10%;
        }
        .box{
            width: 50px;
            height: 70px;
            background: linear-gradient(to right, rgba(255,255,0), gray);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            
            
        }
        .windows{
            display: grid;
            grid-template-columns: repeat(3,80px);
            gap: 15px;
            justify-content: center;
            position: absolute;
            margin-top: 150px;
            margin-left: 100px;
        }
       
        

    </style>
</head>
<body>
    <div id="picture">
       
        <div id="sky" class="big">
            
             <div id="building" class="smaller">
                <div class="windows">
                <div id="window1" class="box"></div>
                <div id="window2" class="box"></div>
                <div id="window3" class="box"></div>
                </div>
                
             </div>
        </div>
        
        
    </div>
</body>
</html>
